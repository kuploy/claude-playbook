# Runs the hook tests on every PR and on main. The repo's first job that runs its own code:
# `two-reviews` counts reviews and is synced to other repos (sync/two-reviews.yml), and `sync`
# copies files out, so until now nothing here executed guard.py at all (#80).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every tests/test_*.py, not a list of names: the console-post host check was rewritten twice
      # and wrong both times because nothing in the repo ran it, and naming files here means the
      # next suite is one forgotten line away from the same gap (#88). All of them run, then the
      # job fails if any did, so one red suite doesn't hide another.
      - run: |
          rc=0
          for t in tests/test_*.py; do
            echo "== $t"
            python3 -I "$t" || rc=1
          done
          exit $rc
