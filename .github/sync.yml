# Read by repo-file-sync-action (see .github/workflows/sync.yml).
# Each push to main opens a PR in every listed repo whose copy differs.
# The repo list lives in your playbook config (#44), not here: add a `repos: |` list above `files:`
# before turning the Action on again. See docs/how-it-works.md.
group:
  files:
    - source: sync/pull_request_template.md
      dest: .github/pull_request_template.md
    - source: sync/two-reviews.yml
      dest: .github/workflows/two-reviews.yml
